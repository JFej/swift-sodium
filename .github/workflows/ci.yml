name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  artifact:
    uses: ./.github/workflows/build-artifact.yml

  test-apple:
    name: Test Apple package
    needs: artifact
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-package
      - name: Test
        run: mise exec -- swift test
      - name: Build transitive consumer
        run: mise exec -- swift run --package-path Examples/Consumer

  test-linux:
    name: Test Linux ${{ matrix.architecture }}
    needs: artifact
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-package
      - run: mise exec -- swift test
      - run: mise exec -- swift run --package-path Examples/Consumer

  test-windows:
    name: Test Windows x86_64
    needs: artifact
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-package
      - run: swift test
      - run: swift run --package-path Examples/Consumer

  compile-android:
    name: Compile Android (${{ matrix.target }})
    needs: artifact
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-android28
          - armv7-unknown-linux-android28
          - x86_64-unknown-linux-android28
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-package
      - name: Install Swift Android SDK
        run: |
          mise exec -- swift sdk install \
            https://download.swift.org/swift-6.3.3-release/android-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_android.artifactbundle.tar.gz \
            --checksum d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          setup_script="$(find "$HOME" -path '*/swift-sdks/*/scripts/setup-android-sdk.sh' -print -quit)"
          test -n "$setup_script"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" "$setup_script"
      - name: Compile package for Android
        run: |
          mise exec -- swift build --package-path Examples/Consumer --swift-sdk "${{ matrix.target }}"
          mise exec -- swift build --build-tests --swift-sdk "${{ matrix.target }}"

  compile-wasi:
    name: Compile WASI consumer
    needs: artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-package
      - name: Install Swift WASI SDK
        run: |
          mise exec -- swift sdk install \
            https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Compile package for WASI
        run: |
          mise exec -- swift build --package-path Examples/Consumer --swift-sdk swift-6.3.3-RELEASE_wasm
          mise exec -- swift build --build-tests --swift-sdk swift-6.3.3-RELEASE_wasm

  compile-apple-platforms:
    name: Compile ${{ matrix.name }}
    needs: artifact
    runs-on: macos-26
    strategy:
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: tvOS
            destination: generic/platform=tvOS
          - name: tvOS Simulator
            destination: generic/platform=tvOS Simulator
          - name: watchOS
            destination: generic/platform=watchOS
          - name: watchOS Simulator
            destination: generic/platform=watchOS Simulator
          - name: visionOS
            destination: generic/platform=visionOS
          - name: visionOS Simulator
            destination: generic/platform=visionOS Simulator
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-package
      - name: Compile Sodium
        run: >-
          xcodebuild
          -scheme Sodium
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO
          build

  sanitizers:
    name: Address and thread sanitizers
    needs: artifact
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-package
      - run: mise run check:sanitizers

  upstream-tests:
    name: Upstream libsodium tests (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - runner: macos-26
            platform: macOS
          - runner: ubuntu-24.04
            platform: Linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.5
      - name: Install native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang make pkg-config
      - run: mise run check:upstream

  style:
    name: Formatting and manifest checks
    needs: artifact
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-package
      - run: mise run lint
      - run: mise exec -- swift package dump-package > /dev/null
