name: Setup Swift package
description: Install the pinned toolchain and materialize the tested CSodium Artifact Bundle.

runs:
  using: composite
  steps:
    - name: Install toolchain
      if: runner.os != 'Windows'
      uses: jdx/mise-action@v4.2.4
    - name: Install Swift on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        winget install --id Swift.Toolchain --exact --version 6.3.3 --source winget --silent --accept-package-agreements --accept-source-agreements

        $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
        $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
        $env:Path = [Environment]::ExpandEnvironmentVariables("$userPath;$machinePath;$env:Path")

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installationPath = & $vswhere -latest -products * -property installationPath |
          Select-Object -First 1
        if (-not $installationPath) {
          throw "Visual Studio installation was not found."
        }
        & "$installationPath\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation

        $env:Path -split ";" |
          Where-Object { $_ } |
          Out-File $env:GITHUB_PATH -Encoding utf8 -Append

        $swiftSDKRoot = Get-ChildItem "$env:LOCALAPPDATA\Programs\Swift\Platforms" -Directory |
          Sort-Object Name -Descending |
          ForEach-Object { Join-Path $_.FullName "Windows.platform\Developer\SDKs\Windows.sdk" } |
          Where-Object { Test-Path $_ } |
          Select-Object -First 1
        if (-not $swiftSDKRoot) {
          throw "The Swift Windows SDK was not found."
        }
        $env:SDKROOT = $swiftSDKRoot

        @("INCLUDE", "LIB", "LIBPATH", "SDKROOT", "UniversalCRTSdkDir", "UCRTVersion", "VCINSTALLDIR", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion") |
          ForEach-Object {
            $value = [Environment]::GetEnvironmentVariable($_)
            if ($value) {
              "$_=$value" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
        swift --version
    - name: Download Artifact Bundle
      uses: actions/download-artifact@v8
      with:
        name: CSodium-artifact-bundle
        path: Artifacts
    - name: Extract Artifact Bundle
      if: runner.os != 'Windows'
      shell: bash
      run: cd Artifacts && unzip -q CSodium.artifactbundle.zip
    - name: Extract Artifact Bundle on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: Expand-Archive Artifacts/CSodium.artifactbundle.zip Artifacts
