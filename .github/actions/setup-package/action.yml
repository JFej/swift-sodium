name: Setup Swift package
description: Install the pinned toolchain and materialize the tested CSodium Artifact Bundle.

runs:
  using: composite
  steps:
    - name: Install toolchain
      if: runner.os != 'Windows'
      uses: jdx/mise-action@v4.2.4
    - name: Install Swift on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        winget install --id Swift.Toolchain --exact --version 6.3.3 --source winget --silent --accept-package-agreements --accept-source-agreements
        $roots = @("$env:LOCALAPPDATA\Programs\Swift", "$env:ProgramFiles\Swift") |
          Where-Object { Test-Path $_ }
        $swift = Get-ChildItem $roots -Filter swift.exe -Recurse |
          Select-Object -First 1
        if ($null -eq $swift) {
          throw "Swift installation did not contain swift.exe."
        }
        $swift.DirectoryName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Download Artifact Bundle
      uses: actions/download-artifact@v8
      with:
        name: CSodium-artifact-bundle
        path: Artifacts
    - name: Extract Artifact Bundle
      if: runner.os != 'Windows'
      shell: bash
      run: cd Artifacts && unzip -q CSodium.artifactbundle.zip
    - name: Extract Artifact Bundle on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: Expand-Archive Artifacts/CSodium.artifactbundle.zip Artifacts
