name: Bug report
description: Report an API or platform problem in swift-sodium.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: swift-sodium version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version and target triple
      placeholder: Swift 6.3.3, aarch64-unknown-linux-gnu
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample and the complete error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
